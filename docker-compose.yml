version: '3.8'

services:
  modresorts:
    build:
      context: .
      dockerfile: Dockerfile
    image: modresorts:latest
    container_name: modresorts-app
    ports:
      - "8080:8080"
    environment:
      # Java/JVM Configuration
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
      
      # Application Configuration (customize as needed)
      # - DATABASE_URL=jdbc:postgresql://your-db-host:5432/modresorts
      # - DATABASE_USERNAME=your-db-user
      # - DATABASE_PASSWORD=your-db-password
      # - REDIS_HOST=your-redis-host
      # - REDIS_PORT=6379
      # - API_KEY=your-api-key
      
    networks:
      - modresorts-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/modresorts/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  modresorts-network:
    driver: bridge
