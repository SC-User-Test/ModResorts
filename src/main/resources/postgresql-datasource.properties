# PostgreSQL DataSource Configuration for ModResorts Application
# Migrated from SQL Server to PostgreSQL 16
#
# This file documents the required environment variables and JNDI datasource
# configuration for connecting to PostgreSQL 16.
#
# Environment Variables (set these in your deployment environment):
#   PGHOST       - PostgreSQL server hostname (default: localhost)
#   PGPORT       - PostgreSQL server port (default: 5432)
#   PGDATABASE   - PostgreSQL database name (default: modresorts)
#   PGUSER       - PostgreSQL username (default: postgres)
#   PGPASSWORD   - PostgreSQL password
#
# JNDI Name: java:app/jdbc/ModResortsDS
# Driver Class: org.postgresql.Driver
# DataSource Class: org.postgresql.ds.PGSimpleDataSource
#
# Connection URL format:
#   jdbc:postgresql://<host>:<port>/<database>?ssl=false&connectTimeout=30
#
# Example connection URL:
#   jdbc:postgresql://localhost:5432/modresorts?ssl=false&connectTimeout=30
#
# Schema Notes (PostgreSQL vs SQL Server):
#   - PostgreSQL treats unquoted identifiers as lowercase
#   - Table 'customer' and column 'info' must exist in lowercase in PostgreSQL
#   - SQL Server was case-insensitive; PostgreSQL is case-sensitive by default
#
# Required PostgreSQL schema:
#   CREATE TABLE IF NOT EXISTS customer (
#       id   SERIAL PRIMARY KEY,
#       info TEXT NOT NULL
#   );
#
# Connection Pool Settings (recommended for production):
#   minimumIdle=5
#   maximumPoolSize=20
#   connectionTimeout=30000
#   idleTimeout=600000
#   maxLifetime=1800000
