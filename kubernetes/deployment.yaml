apiVersion: apps/v1
kind: Deployment
metadata:
  name: modresorts
  namespace: modresorts
  labels:
    app: modresorts
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modresorts
  template:
    metadata:
      labels:
        app: modresorts
        version: "2.0.0"
    spec:
      containers:
      - name: modresorts
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
        - name: TZ
          value: "UTC"
        # Add environment variables for external dependencies as needed
        # - name: DATABASE_URL
        #   value: "{{DATABASE_URL}}"
        # - name: DATABASE_USERNAME
        #   valueFrom:
        #     secretKeyRef:
        #       name: modresorts-secrets
        #       key: db-username
        # - name: DATABASE_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: modresorts-secrets
        #       key: db-password
        # - name: REDIS_HOST
        #   value: "{{REDIS_HOST}}"
        # - name: REDIS_PORT
        #   value: "6379"
        # - name: API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: modresorts-secrets
        #       key: api-key
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /modresorts/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /modresorts/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
